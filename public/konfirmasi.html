<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Konfirmasi Serah Terima — Web Linen</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap"
    rel="stylesheet"
  >

  <style>
    :root{
      --bg:#F5F7F6;
      --surface:#FFFFFF;
      --ink:#1C2B33;
      --ink-soft:#5B6B70;
      --line:#DCE3E1;

      --teal:#00b1b7;
      --teal-dark:#008F94;
      --teal-tint:#E7F2EE;

      --orange:#B66A19;
      --orange-tint:#FFF4E4;

      --red:#B34A3E;
      --red-tint:#FBEAE7;

      --blue:#2868A8;
      --blue-tint:#EAF2FA;

      --radius:12px;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      background:var(--bg);
      color:var(--ink);
      font-family:'Public Sans',system-ui,sans-serif;
      padding:28px 18px 50px;
    }

    .wrap{
      width:100%;
      max-width:1000px;
      margin:0 auto;
    }

    /* =========================
       TOPBAR
    ========================= */

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
      margin-bottom:25px;
    }

    .back-link{
      color:var(--ink-soft);
      text-decoration:none;
      font-size:13px;
      font-weight:600;
    }

    .back-link:hover{
      color:var(--teal-dark);
    }

    .logout-link{
      color:var(--ink-soft);
      text-decoration:none;
      font-size:13px;
      font-weight:600;
      padding:8px 13px;
      border:1px solid var(--line);
      border-radius:8px;
      background:var(--surface);
    }

    .logout-link:hover{
      color:var(--red);
      background:var(--red-tint);
    }

    /* =========================
       HEADER
    ========================= */

    .brand{
      margin-bottom:25px;
    }

    .brand .unit{
      display:block;
      color:var(--teal);
      font-size:13px;
      font-weight:700;
      margin-bottom:5px;
    }

    h1{
      margin:0;
      font-family:'Source Serif 4',Georgia,serif;
      font-size:30px;
      font-weight:600;
    }

    .subtitle{
      color:var(--ink-soft);
      font-size:14px;
      margin:8px 0 0;
    }

    /* =========================
       MESSAGE
    ========================= */

    .message{
      display:none;
      padding:12px 14px;
      border-radius:8px;
      font-size:13px;
      margin-bottom:18px;
    }

    .message.success{
      display:block;
      background:var(--teal-tint);
      border:1px solid #CDE5DE;
      color:#24645C;
    }

    .message.error{
      display:block;
      background:var(--red-tint);
      border:1px solid #EFC7C0;
      color:var(--red);
    }

    /* =========================
       EMPTY
    ========================= */

    .empty{
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:35px 20px;
      text-align:center;
      color:var(--ink-soft);
      font-size:14px;
    }

    .loading{
      display:flex;
      justify-content:center;
      align-items:center;
    }

    /* =========================
       TRANSACTION CARD
    ========================= */

    .transaction-card{
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:var(--radius);
      margin-bottom:20px;
      overflow:hidden;
    }

    .transaction-header{
      padding:18px 20px;
      border-bottom:1px solid var(--line);

      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:15px;
    }

    .transaction-title{
      margin:0;
      font-size:16px;
      font-weight:800;
    }

    .transaction-meta{
      margin-top:6px;
      color:var(--ink-soft);
      font-size:12px;
      line-height:1.6;
    }

    .badge{
      display:inline-flex;
      align-items:center;

      padding:6px 10px;

      border-radius:999px;

      font-size:11px;
      font-weight:700;

      white-space:nowrap;
    }

    .badge-pengantaran{
      background:var(--blue-tint);
      color:var(--blue);
    }

    .badge-pengambilan{
      background:var(--orange-tint);
      color:var(--orange);
    }

    .transaction-body{
      padding:20px;
    }

    /* =========================
       INFO BOX
    ========================= */

    .info-box{
      border-radius:9px;
      padding:13px 15px;
      margin-bottom:18px;
    }

    .info-box.pengantaran{
      background:var(--blue-tint);
      border:1px solid #D1E1F0;
    }

    .info-box.pengambilan{
      background:var(--orange-tint);
      border:1px solid #F0D8B5;
    }

    .info-box strong{
      display:block;
      font-size:13px;
      margin-bottom:4px;
    }

    .info-box span{
      font-size:12px;
      color:var(--ink-soft);
      line-height:1.5;
    }

    /* =========================
       TABLE
    ========================= */

    .table-wrap{
      overflow-x:auto;

      border:1px solid var(--line);
      border-radius:9px;

      margin-bottom:20px;
    }

    table{
      width:100%;
      border-collapse:collapse;

      min-width:600px;
    }

    th,
    td{
      padding:11px 12px;

      border-bottom:1px solid var(--line);

      text-align:left;

      font-size:13px;
    }

    th{
      background:#F8FAF9;

      color:var(--ink-soft);

      font-size:11px;
      font-weight:700;
    }

    tbody tr:last-child td{
      border-bottom:none;
    }

    .linen-name{
      font-weight:700;
    }

    .number{
      font-weight:700;
      text-align:center;
    }

    .total-row{
      background:#FAFCFB;
    }

    /* =========================
       SECTION
    ========================= */

    .section-title{
      font-size:14px;
      font-weight:800;

      margin:0 0 14px;
    }

    .form-grid{
      display:grid;
      grid-template-columns:1fr;

      gap:15px;

      margin-bottom:18px;
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:7px;
    }

    label{
      font-size:12px;
      font-weight:700;

      color:var(--ink-soft);
    }

    input{
      width:100%;

      border:1px solid var(--line);
      border-radius:8px;

      padding:11px 12px;

      font:inherit;
      font-size:14px;

      outline:none;
    }

    input:focus{
      border-color:var(--teal);

      box-shadow:
        0 0 0 3px rgba(0,177,183,.10);
    }

    /* =========================
       SIGNATURE
    ========================= */

    .signature-wrapper{
      border:1px solid var(--line);

      border-radius:9px;

      overflow:hidden;

      background:#fff;
    }

    .signature-label{
      padding:10px 12px;

      background:#F8FAF9;

      border-bottom:1px solid var(--line);

      font-size:11px;

      color:var(--ink-soft);

      font-weight:700;
    }

    canvas{
      display:block;

      width:100%;
      height:180px;

      background:white;

      cursor:crosshair;

      touch-action:none;
    }

    .signature-actions{
      display:flex;

      justify-content:flex-end;

      padding:8px 10px;

      border-top:1px solid var(--line);
    }

    .btn-clear{
      border:none;

      background:transparent;

      color:var(--red);

      font:inherit;

      font-size:11px;

      font-weight:700;

      cursor:pointer;
    }

    /* =========================
       ACTION
    ========================= */

    .actions{
      display:flex;

      justify-content:flex-end;

      gap:10px;
    }

    button{
      border:none;

      border-radius:8px;

      padding:11px 18px;

      font:inherit;

      font-size:13px;

      font-weight:700;

      cursor:pointer;
    }

    .btn-primary{
      background:var(--teal);

      color:white;
    }

    .btn-primary:hover{
      background:var(--teal-dark);
    }

    .btn-primary:disabled{
      opacity:.6;

      cursor:not-allowed;
    }

    /* =========================
       MOBILE
    ========================= */

    @media(max-width:700px){

      body{
        padding:20px 14px 40px;
      }

      h1{
        font-size:26px;
      }

      .transaction-header{
        flex-direction:column;
      }

      .actions{
        flex-direction:column;
      }

      .actions button{
        width:100%;
      }

      canvas{
        height:160px;
      }

    }

  </style>
</head>


<body>

<div class="wrap">

  <!-- ======================================================
       TOPBAR
  ======================================================= -->

  <div class="topbar">

    <a
      href="/user-dashboard.html"
      class="back-link"
    >
      ← Kembali ke Dashboard
    </a>

    <a
      href="/logout"
      class="logout-link"
    >
      Keluar
    </a>

  </div>


  <!-- ======================================================
       HEADER
  ======================================================= -->

  <div class="brand">

    <span class="unit">
      Ruangan
    </span>

    <h1>
      Konfirmasi Serah Terima
    </h1>

    <p class="subtitle">
      Periksa linen sebelum memberikan tanda tangan.
    </p>

  </div>


  <!-- ======================================================
       MESSAGE
  ======================================================= -->

  <div
    id="message"
    class="message"
  ></div>


  <!-- ======================================================
       TRANSACTIONS
  ======================================================= -->

  <div id="transactions-container">

    <div class="empty loading">
      Memuat transaksi...
    </div>

  </div>

</div>


<script>

  // ==========================================================
  // ELEMENT
  // ==========================================================

  const container =
    document.getElementById(
      'transactions-container'
    );


  const messageBox =
    document.getElementById(
      'message'
    );


  // ==========================================================
  // SIGNATURE
  // ==========================================================

  const signatures = {};


  // ==========================================================
  // MESSAGE
  // ==========================================================

  function showMessage(
    text,
    type = 'error'
  ){

    messageBox.textContent =
      text;

    messageBox.className =
      `message ${type}`;

    window.scrollTo({
      top:0,
      behavior:'smooth'
    });

  }


  function clearMessage(){

    messageBox.textContent =
      '';

    messageBox.className =
      'message';

  }


  // ==========================================================
  // ESCAPE HTML
  // ==========================================================

  function escapeHtml(value){

    return String(value ?? '')
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#039;');

  }


  // ==========================================================
  // FORMAT DATE
  // ==========================================================

  function formatDate(value){

    if(!value){
      return '-';
    }


    const date =
      new Date(value);


    if(
      Number.isNaN(
        date.getTime()
      )
    ){

      return value;

    }


    return date.toLocaleDateString(
      'id-ID',
      {
        day:'2-digit',
        month:'long',
        year:'numeric'
      }
    );

  }


  // ==========================================================
  // GET DETAIL
  // ==========================================================

  function getDetails(transaction){

    return (
      transaction.detail ||
      transaction.details ||
      transaction.items ||
      []
    );

  }


  // ==========================================================
  // AMBIL DETAIL TRANSAKSI
  // ==========================================================

  async function loadTransactionDetail(
    transaction
  ){

    try{

      const res =
        await fetch(
          `/api/serah-terima/${transaction.id}`
        );


      if(!res.ok){

        console.warn(
          `Detail transaksi #${transaction.id} gagal diambil.`
        );

        return transaction;

      }


      const result =
        await res.json();


      if(
        result &&
        typeof result === 'object'
      ){

        return {
          ...transaction,
          ...result
        };

      }


      return transaction;

    }catch(error){

      console.error(
        `Gagal mengambil detail transaksi #${transaction.id}:`,
        error
      );

      return transaction;

    }

  }


  // ==========================================================
  // FILTER TRANSAKSI YANG BENAR-BENAR BUTUH TINDAKAN USER
  // ==========================================================

  function needsUserConfirmation(
    transaction
  ){

    if(
      transaction.status !==
      'menunggu_konfirmasi'
    ){

      return false;

    }


    const jenisTransaksi =
      String(
        transaction.jenis_transaksi ||
        'pengantaran'
      ).toLowerCase();


    // --------------------------------------------------------
    // PENGAMBILAN
    //
    // User harus tanda tangan sebagai PENYERAH.
    //
    // Kalau tanda_tangan_penyerah sudah ada,
    // tugas user sudah selesai.
    // --------------------------------------------------------

    if(
      jenisTransaksi ===
      'pengambilan'
    ){

      return !Boolean(
        transaction.tanda_tangan_penyerah
      );

    }


    // --------------------------------------------------------
    // PENGANTARAN
    //
    // User harus tanda tangan sebagai PENERIMA.
    //
    // Kalau tanda_tangan sudah ada,
    // tugas user sudah selesai.
    // --------------------------------------------------------

    return !Boolean(
      transaction.tanda_tangan
    );

  }


  // ==========================================================
  // LOAD TRANSACTIONS
  // ==========================================================

  async function loadTransactions(){

    clearMessage();


    container.innerHTML = `
      <div class="empty loading">
        Memuat transaksi...
      </div>
    `;


    try{

      // ------------------------------------------------------
      // 1. AMBIL DAFTAR TRANSAKSI
      // ------------------------------------------------------

      const res =
        await fetch(
          '/api/serah-terima'
        );


      if(!res.ok){

        throw new Error(
          'Gagal mengambil data transaksi.'
        );

      }


      const result =
        await res.json();


      const rows =
        Array.isArray(result)
          ? result
          : result.data || [];


      // ------------------------------------------------------
      // 2. FILTER TRANSAKSI USER
      // ------------------------------------------------------

      const pending =
        rows.filter(
          needsUserConfirmation
        );


      // ------------------------------------------------------
      // 3. TIDAK ADA TRANSAKSI
      // ------------------------------------------------------

      if(
        pending.length === 0
      ){

        container.innerHTML = `
          <div class="empty">
            Tidak ada transaksi yang menunggu konfirmasi.
          </div>
        `;

        return;

      }


      // ------------------------------------------------------
      // 4. AMBIL DETAIL SEMUA TRANSAKSI
      // ------------------------------------------------------

      const detailedTransactions =
        await Promise.all(
          pending.map(
            transaction =>
              loadTransactionDetail(
                transaction
              )
          )
        );


      // ------------------------------------------------------
      // 5. FILTER ULANG SETELAH DETAIL DIAMBIL
      //
      // Ini penting karena tanda tangan bisa saja
      // hanya tersedia pada endpoint detail.
      // ------------------------------------------------------

      const stillNeedsConfirmation =
        detailedTransactions.filter(
          needsUserConfirmation
        );


      if(
        stillNeedsConfirmation.length === 0
      ){

        container.innerHTML = `
          <div class="empty">
            Tidak ada transaksi yang menunggu konfirmasi.
          </div>
        `;

        return;

      }


      // ------------------------------------------------------
      // 6. RENDER
      // ------------------------------------------------------

      renderTransactions(
        stillNeedsConfirmation
      );


    }catch(err){

      console.error(err);


      container.innerHTML = `
        <div class="empty">
          Gagal memuat transaksi.
        </div>
      `;


      showMessage(
        err.message ||
        'Gagal memuat transaksi.'
      );

    }

  }


  // ==========================================================
  // RENDER
  // ==========================================================

  function renderTransactions(
    transactions
  ){

    container.innerHTML =
      '';


    transactions.forEach(
      transaction => {

        const card =
          createTransactionCard(
            transaction
          );


        container.appendChild(
          card
        );


        setupSignatureCanvas(
          transaction.id
        );

      }
    );

  }


  // ==========================================================
  // CREATE CARD
  // ==========================================================

  function createTransactionCard(
    transaction
  ){

    const card =
      document.createElement(
        'div'
      );


    card.className =
      'transaction-card';


    const jenisTransaksi =
      String(
        transaction.jenis_transaksi ||
        'pengantaran'
      ).toLowerCase();


    const isPengambilan =
      jenisTransaksi ===
      'pengambilan';


    // --------------------------------------------------------
    // DETAIL
    // --------------------------------------------------------

    const details =
      getDetails(
        transaction
      );


    let totalDiantar =
      0;


    let totalInfeksius =
      0;


    let totalNonInfeksius =
      0;


    let rowsHtml =
      '';


    // --------------------------------------------------------
    // LOOP DETAIL
    // --------------------------------------------------------

    details.forEach(
      item => {

        /*
          FIELD YANG BENAR:

          jenis_linen_nama

          Contoh:
          "Handuk Besar"
        */

        const namaLinen =
          item.jenis_linen_nama ||
          '-';


        const diantar =
          Number(
            item.jumlah_kotor
          ) || 0;


        const infeksius =
          Number(
            item.jumlah_diambil_infeksius
          ) || 0;


        const nonInfeksius =
          Number(
            item.jumlah_diambil_non_infeksius
          ) || 0;


        totalDiantar +=
          diantar;


        totalInfeksius +=
          infeksius;


        totalNonInfeksius +=
          nonInfeksius;


        // ----------------------------------------------------
        // PENGAMBILAN
        // ----------------------------------------------------

        if(isPengambilan){

          rowsHtml += `

            <tr>

              <td>

                <div class="linen-name">
                  ${escapeHtml(
                    namaLinen
                  )}
                </div>

              </td>


              <td class="number">
                ${infeksius}
              </td>


              <td class="number">
                ${nonInfeksius}
              </td>

            </tr>

          `;

        }


        // ----------------------------------------------------
        // PENGANTARAN
        // ----------------------------------------------------

        else{

          rowsHtml += `

            <tr>

              <td>

                <div class="linen-name">
                  ${escapeHtml(
                    namaLinen
                  )}
                </div>

              </td>


              <td class="number">
                ${diantar}
              </td>

            </tr>

          `;

        }

      }
    );


    // --------------------------------------------------------
    // JIKA DETAIL KOSONG
    // --------------------------------------------------------

    if(!rowsHtml){

      rowsHtml =
        isPengambilan

          ? `
            <tr>

              <td colspan="3">
                Tidak ada detail linen.
              </td>

            </tr>
          `

          : `
            <tr>

              <td colspan="2">
                Tidak ada detail linen.
              </td>

            </tr>
          `;

    }


    // ========================================================
    // TEXT
    // ========================================================

    const badgeClass =
      isPengambilan
        ? 'badge-pengambilan'
        : 'badge-pengantaran';


    const badgeText =
      isPengambilan
        ? 'Pengambilan'
        : 'Pengantaran';


    const infoClass =
      isPengambilan
        ? 'pengambilan'
        : 'pengantaran';


    const title =
      isPengambilan
        ? 'Pengambilan Linen Kotor'
        : 'Pengantaran Linen Bersih';


    const infoText =
      isPengambilan

        ? 'Periksa jumlah linen kotor yang akan diserahkan kepada Laundry. Jika sudah sesuai, isi nama dan berikan tanda tangan sebagai pihak yang menyerahkan linen.'

        : 'Periksa jumlah linen bersih yang diterima dari Laundry. Jika sudah sesuai, isi nama dan berikan tanda tangan sebagai pihak yang menerima linen.';


    const sectionTitle =
      isPengambilan
        ? 'Konfirmasi Penyerahan'
        : 'Konfirmasi Penerimaan';


    const nameLabel =
      isPengambilan
        ? 'Nama Penyerah'
        : 'Nama Penerima';


    const namePlaceholder =
      isPengambilan
        ? 'Masukkan nama petugas yang menyerahkan'
        : 'Masukkan nama petugas yang menerima';


    const signatureLabel =
      isPengambilan
        ? 'TTD petugas ruangan yang menyerahkan linen'
        : 'TTD petugas ruangan yang menerima linen';


    const buttonText =
      isPengambilan
        ? 'Konfirmasi Penyerahan'
        : 'Konfirmasi Penerimaan';


    // ========================================================
    // TOTAL
    // ========================================================

    const totalRowHtml =
      isPengambilan

        ? `

          <tr class="total-row">

            <td>
              <strong>
                Total
              </strong>
            </td>


            <td class="number">
              ${totalInfeksius}
            </td>


            <td class="number">
              ${totalNonInfeksius}
            </td>

          </tr>

        `

        : `

          <tr class="total-row">

            <td>
              <strong>
                Total
              </strong>
            </td>


            <td class="number">
              ${totalDiantar}
            </td>

          </tr>

        `;


    // ========================================================
    // CARD HTML
    // ========================================================

    card.innerHTML = `

      <div class="transaction-header">

        <div>

          <h2 class="transaction-title">
            Transaksi #${escapeHtml(
              transaction.id
            )}
          </h2>


          <div class="transaction-meta">

            Ruangan:

            <strong>
              ${escapeHtml(
                transaction.ruangan
              )}
            </strong>

            &nbsp; • &nbsp;

            Tanggal:

            <strong>
              ${formatDate(
                transaction.tanggal
              )}
            </strong>

          </div>

        </div>


        <span class="badge ${badgeClass}">
          ${badgeText}
        </span>

      </div>


      <div class="transaction-body">


        <div class="info-box ${infoClass}">

          <strong>
            ${title}
          </strong>


          <span>
            ${infoText}
          </span>

        </div>


        <div class="table-wrap">

          <table>

            <thead>

              ${
                isPengambilan

                  ? `

                    <tr>

                      <th>
                        Jenis Linen
                      </th>

                      <th>
                        Infeksius
                      </th>

                      <th>
                        Non-infeksius
                      </th>

                    </tr>

                  `

                  : `

                    <tr>

                      <th>
                        Jenis Linen
                      </th>

                      <th>
                        Diantar
                      </th>

                    </tr>

                  `
              }

            </thead>


            <tbody>

              ${rowsHtml}

              ${totalRowHtml}

            </tbody>

          </table>

        </div>


        <h3 class="section-title">
          ${sectionTitle}
        </h3>


        <div class="form-grid">


          <!-- NAMA -->

          <div class="field">

            <label
              for="nama-${transaction.id}"
            >
              ${nameLabel}
            </label>


            <input
              type="text"
              id="nama-${transaction.id}"
              placeholder="${namePlaceholder}"
              autocomplete="off"
            >

          </div>


          <!-- TTD -->

          <div>

            <label>
              Tanda Tangan
            </label>


            <div class="signature-wrapper">


              <div class="signature-label">
                ${signatureLabel}
              </div>


              <canvas
                id="signature-${transaction.id}"
              ></canvas>


              <div class="signature-actions">

                <button
                  type="button"
                  class="btn-clear"
                  onclick="clearSignature(
                    ${transaction.id}
                  )"
                >
                  Hapus Tanda Tangan
                </button>

              </div>


            </div>

          </div>


        </div>


        <div class="actions">

          <button
            type="button"
            class="btn-primary"
            id="submit-${transaction.id}"
            onclick="konfirmasiTransaksi(
              ${transaction.id},
              '${jenisTransaksi}'
            )"
          >
            ${buttonText}
          </button>

        </div>


      </div>

    `;


    return card;

  }


  // ==========================================================
  // SETUP CANVAS
  // ==========================================================

  function setupSignatureCanvas(
    transactionId
  ){

    const canvas =
      document.getElementById(
        `signature-${transactionId}`
      );


    if(!canvas){
      return;
    }


    const ctx =
      canvas.getContext('2d');


    let drawing =
      false;


    function resizeCanvas(){

      const ratio =
        Math.max(
          window.devicePixelRatio || 1,
          1
        );


      const rect =
        canvas.getBoundingClientRect();


      canvas.width =
        rect.width * ratio;


      canvas.height =
        rect.height * ratio;


      ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
      );


      ctx.lineWidth =
        2;


      ctx.lineCap =
        'round';


      ctx.lineJoin =
        'round';


      ctx.strokeStyle =
        '#1C2B33';

    }


    resizeCanvas();


    function getPosition(event){

      const rect =
        canvas.getBoundingClientRect();


      return {

        x:
          event.clientX -
          rect.left,

        y:
          event.clientY -
          rect.top

      };

    }


    canvas.addEventListener(
      'pointerdown',
      event => {

        drawing =
          true;


        canvas.setPointerCapture(
          event.pointerId
        );


        const pos =
          getPosition(event);


        ctx.beginPath();


        ctx.moveTo(
          pos.x,
          pos.y
        );

      }
    );


    canvas.addEventListener(
      'pointermove',
      event => {

        if(!drawing){
          return;
        }


        const pos =
          getPosition(event);


        ctx.lineTo(
          pos.x,
          pos.y
        );


        ctx.stroke();

      }
    );


    canvas.addEventListener(
      'pointerup',
      event => {

        drawing =
          false;


        try{

          canvas.releasePointerCapture(
            event.pointerId
          );

        }catch(error){}


      }
    );


    canvas.addEventListener(
      'pointercancel',
      () => {

        drawing =
          false;

      }
    );

  }


  // ==========================================================
  // CLEAR SIGNATURE
  // ==========================================================

  function clearSignature(
    transactionId
  ){

    const canvas =
      document.getElementById(
        `signature-${transactionId}`
      );


    if(!canvas){
      return;
    }


    const ctx =
      canvas.getContext('2d');


    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

  }


  // ==========================================================
  // CHECK SIGNATURE
  // ==========================================================

  function hasSignature(
    transactionId
  ){

    const canvas =
      document.getElementById(
        `signature-${transactionId}`
      );


    if(!canvas){
      return false;
    }


    const ctx =
      canvas.getContext('2d');


    const imageData =
      ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
      );


    for(
      let i = 3;
      i < imageData.data.length;
      i += 4
    ){

      if(
        imageData.data[i] > 0
      ){

        return true;

      }

    }


    return false;

  }


  // ==========================================================
  // KONFIRMASI TRANSAKSI
  // ==========================================================

  async function konfirmasiTransaksi(
    transactionId,
    jenisTransaksi
  ){

    clearMessage();


    const isPengambilan =
      jenisTransaksi ===
      'pengambilan';


    const namaInput =
      document.getElementById(
        `nama-${transactionId}`
      );


    const button =
      document.getElementById(
        `submit-${transactionId}`
      );


    const canvas =
      document.getElementById(
        `signature-${transactionId}`
      );


    const nama =
      namaInput
        ? namaInput.value.trim()
        : '';


    // --------------------------------------------------------
    // VALIDASI NAMA
    // --------------------------------------------------------

    if(!nama){

      showMessage(

        isPengambilan

          ? 'Nama penyerah wajib diisi.'

          : 'Nama penerima wajib diisi.'

      );


      namaInput?.focus();

      return;

    }


    // --------------------------------------------------------
    // VALIDASI TTD
    // --------------------------------------------------------

    if(
      !hasSignature(
        transactionId
      )
    ){

      showMessage(

        isPengambilan

          ? 'Tanda tangan penyerah wajib diisi.'

          : 'Tanda tangan penerima wajib diisi.'

      );


      return;

    }


    const tandaTangan =
      canvas.toDataURL(
        'image/png'
      );


    // --------------------------------------------------------
    // ENDPOINT
    // --------------------------------------------------------

    const endpoint =
      isPengambilan

        ? `/api/serah-terima/${transactionId}/konfirmasi-penyerahan`

        : `/api/serah-terima/${transactionId}/konfirmasi-penerimaan`;


    // --------------------------------------------------------
    // BODY
    // --------------------------------------------------------

    const body =
      isPengambilan

        ? {

            nama_penyerah:
              nama,

            tanda_tangan_penyerah:
              tandaTangan

          }

        : {

            nama_penerima:
              nama,

            tanda_tangan:
              tandaTangan

          };


    try{

      button.disabled =
        true;


      button.textContent =
        'Menyimpan...';


      const res =
        await fetch(
          endpoint,
          {
            method:'PUT',

            headers:{
              'Content-Type':
                'application/json'
            },

            body:
              JSON.stringify(
                body
              )

          }
        );


      const result =
        await res.json()
          .catch(
            () => ({})
          );


      if(!res.ok){

        throw new Error(
          result.error ||
          'Gagal melakukan konfirmasi.'
        );

      }


      // ------------------------------------------------------
      // BERHASIL
      // ------------------------------------------------------

      showMessage(

  isPengambilan

    ? 'Penyerahan berhasil dikonfirmasi. Transaksi selanjutnya menunggu penerimaan dari Laundry.'

    : 'Penerimaan berhasil dikonfirmasi. Transaksi selanjutnya menunggu tanda tangan dari Laundry.',

  'success'

);


      // ------------------------------------------------------
      // REFRESH
      // ------------------------------------------------------

      setTimeout(
        () => {

          loadTransactions();

        },
        1000
      );


    }catch(err){

      console.error(err);


      showMessage(
        err.message ||
        'Gagal melakukan konfirmasi.'
      );


      button.disabled =
        false;


      button.textContent =

        isPengambilan

          ? 'Konfirmasi Penyerahan'

          : 'Konfirmasi Penerimaan';

    }

  }


  // ==========================================================
  // START
  // ==========================================================

  loadTransactions();

</script>

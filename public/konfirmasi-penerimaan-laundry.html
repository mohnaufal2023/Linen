<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Penerimaan Linen — Web Linen</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap"
    rel="stylesheet"
  >

  <style>

    :root{
      --bg:#F5F7F6;
      --surface:#FFFFFF;
      --ink:#1C2B33;
      --ink-soft:#5B6B70;
      --line:#DCE3E1;

      --teal:#00b1b7;
      --teal-dark:#008F94;
      --teal-tint:#E7F2EE;

      --orange:#B66A19;
      --orange-tint:#FFF4E4;

      --red:#B34A3E;
      --red-tint:#FBEAE7;

      --blue:#2868A8;
      --blue-tint:#EAF2FA;

      --radius:12px;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;

      background:var(--bg);
      color:var(--ink);

      font-family:'Public Sans',system-ui,sans-serif;

      padding:28px 18px 50px;
    }

    .wrap{
      width:100%;
      max-width:1000px;
      margin:0 auto;
    }

    /* =========================
       TOPBAR
    ========================= */

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;

      margin-bottom:25px;
    }

    .back-link{
      color:var(--ink-soft);
      text-decoration:none;

      font-size:13px;
      font-weight:600;
    }

    .back-link:hover{
      color:var(--teal-dark);
    }

    .logout-link{
      color:var(--ink-soft);
      text-decoration:none;

      font-size:13px;
      font-weight:600;

      padding:8px 13px;

      border:1px solid var(--line);
      border-radius:8px;

      background:var(--surface);
    }

    .logout-link:hover{
      color:var(--red);
      background:var(--red-tint);
    }

    /* =========================
       HEADER
    ========================= */

    .brand{
      margin-bottom:25px;
    }

    .unit{
      display:block;

      color:var(--teal);

      font-size:13px;
      font-weight:700;

      margin-bottom:5px;
    }

    h1{
      margin:0;

      font-family:'Source Serif 4',Georgia,serif;

      font-size:30px;
      font-weight:600;
    }

    .subtitle{
      color:var(--ink-soft);

      font-size:14px;

      margin:8px 0 0;
    }

    /* =========================
       MESSAGE
    ========================= */

    .message{
      display:none;

      padding:12px 14px;

      border-radius:8px;

      font-size:13px;

      margin-bottom:18px;
    }

    .message.success{
      display:block;

      background:var(--teal-tint);

      border:1px solid #CDE5DE;

      color:#24645C;
    }

    .message.error{
      display:block;

      background:var(--red-tint);

      border:1px solid #EFC7C0;

      color:var(--red);
    }

    /* =========================
       EMPTY
    ========================= */

    .empty{
      background:var(--surface);

      border:1px solid var(--line);

      border-radius:var(--radius);

      padding:35px 20px;

      text-align:center;

      color:var(--ink-soft);

      font-size:14px;
    }

    /* =========================
       CARD
    ========================= */

    .transaction-card{
      background:var(--surface);

      border:1px solid var(--line);

      border-radius:var(--radius);

      margin-bottom:20px;

      overflow:hidden;
    }

    .transaction-header{
      padding:18px 20px;

      border-bottom:1px solid var(--line);

      display:flex;

      justify-content:space-between;

      align-items:flex-start;

      gap:15px;
    }

    .transaction-title{
      margin:0;

      font-size:17px;

      font-weight:800;
    }

    .transaction-meta{
      margin-top:6px;

      color:var(--ink-soft);

      font-size:12px;

      line-height:1.6;
    }

    .badge{
      display:inline-flex;

      align-items:center;

      padding:6px 10px;

      border-radius:999px;

      font-size:11px;

      font-weight:700;

      white-space:nowrap;
    }

    .badge-pengambilan{
      background:var(--orange-tint);

      color:var(--orange);
    }

    /* =========================
       BODY
    ========================= */

    .transaction-body{
      padding:20px;
    }

    .info-box{
      background:var(--orange-tint);

      border:1px solid #F0D8B5;

      border-radius:9px;

      padding:14px 15px;

      margin-bottom:18px;
    }

    .info-box strong{
      display:block;

      font-size:13px;

      margin-bottom:4px;
    }

    .info-box span{
      color:var(--ink-soft);

      font-size:12px;

      line-height:1.5;
    }

    /* =========================
       TABLE
    ========================= */

    .table-wrap{
      overflow-x:auto;

      border:1px solid var(--line);

      border-radius:9px;

      margin-bottom:20px;
    }

    table{
      width:100%;

      border-collapse:collapse;

      min-width:600px;
    }

    th,
    td{
      padding:11px 12px;

      border-bottom:1px solid var(--line);

      font-size:13px;

      text-align:left;
    }

    th{
      background:#F8FAF9;

      color:var(--ink-soft);

      font-size:11px;

      font-weight:700;
    }

    tbody tr:last-child td{
      border-bottom:none;
    }

    .linen-name{
      font-weight:700;
    }

    .number{
      text-align:center;

      font-weight:700;
    }

    .total-row{
      background:#FAFCFB;
    }

    /* =========================
       SECTION
    ========================= */

    .section-title{
      margin:0 0 14px;

      font-size:14px;

      font-weight:800;
    }

    .field{
      display:flex;

      flex-direction:column;

      gap:7px;

      margin-bottom:15px;
    }

    label{
      color:var(--ink-soft);

      font-size:12px;

      font-weight:700;
    }

    input{
      width:100%;

      padding:11px 12px;

      border:1px solid var(--line);

      border-radius:8px;

      outline:none;

      font:inherit;

      font-size:14px;
    }

    input:focus{
      border-color:var(--teal);

      box-shadow:
        0 0 0 3px rgba(0,177,183,.10);
    }

    /* =========================
       SIGNATURE
    ========================= */

    .signature-wrapper{
      overflow:hidden;

      border:1px solid var(--line);

      border-radius:9px;

      background:#fff;

      margin-bottom:18px;
    }

    .signature-label{
      padding:10px 12px;

      background:#F8FAF9;

      border-bottom:1px solid var(--line);

      color:var(--ink-soft);

      font-size:11px;

      font-weight:700;
    }

    canvas{
      display:block;

      width:100%;

      height:180px;

      background:white;

      cursor:crosshair;

      touch-action:none;
    }

    .signature-actions{
      display:flex;

      justify-content:flex-end;

      padding:8px 10px;

      border-top:1px solid var(--line);
    }

    .btn-clear{
      border:none;

      background:transparent;

      color:var(--red);

      font:inherit;

      font-size:11px;

      font-weight:700;

      cursor:pointer;
    }

    /* =========================
       BUTTON
    ========================= */

    .actions{
      display:flex;

      justify-content:flex-end;
    }

    button{
      border:none;

      border-radius:8px;

      padding:11px 18px;

      font:inherit;

      font-size:13px;

      font-weight:700;

      cursor:pointer;
    }

    .btn-primary{
      background:var(--teal);

      color:white;
    }

    .btn-primary:hover{
      background:var(--teal-dark);
    }

    .btn-primary:disabled{
      opacity:.6;

      cursor:not-allowed;
    }

    /* =========================
       MOBILE
    ========================= */

    @media(max-width:700px){

      body{
        padding:20px 14px 40px;
      }

      h1{
        font-size:26px;
      }

      .transaction-header{
        flex-direction:column;
      }

      .actions{
        width:100%;
      }

      .actions button{
        width:100%;
      }

      canvas{
        height:160px;
      }

    }

  </style>
</head>


<body>

<div class="wrap">

  <!-- ======================================================
       TOPBAR
  ======================================================= -->

  <div class="topbar">

    <a
      href="/laundry-dashboard.html"
      class="back-link"
    >
      ← Kembali ke Dashboard
    </a>

    <a
      href="/logout"
      class="logout-link"
    >
      Keluar
    </a>

  </div>


  <!-- ======================================================
       HEADER
  ======================================================= -->

  <div class="brand">

    <span class="unit">
      Laundry
    </span>

    <h1>
      Penerimaan Linen Kotor
    </h1>

    <p class="subtitle">
      Periksa linen yang diserahkan dari ruangan sebelum memberikan tanda tangan.
    </p>

  </div>


  <!-- ======================================================
       MESSAGE
  ======================================================= -->

  <div
    id="message"
    class="message"
  ></div>


  <!-- ======================================================
       TRANSACTIONS
  ======================================================= -->

  <div id="transactions-container">

    <div class="empty">
      Memuat transaksi...
    </div>

  </div>

</div>


<script>

  // ==========================================================
  // ELEMENT
  // ==========================================================

  const container =
    document.getElementById(
      'transactions-container'
    );


  const messageBox =
    document.getElementById(
      'message'
    );


  // ==========================================================
  // MESSAGE
  // ==========================================================

  function showMessage(
    text,
    type = 'error'
  ){

    messageBox.textContent =
      text;

    messageBox.className =
      `message ${type}`;

    window.scrollTo({
      top:0,
      behavior:'smooth'
    });

  }


  function clearMessage(){

    messageBox.textContent =
      '';

    messageBox.className =
      'message';

  }


  // ==========================================================
  // ESCAPE HTML
  // ==========================================================

  function escapeHtml(value){

    return String(value ?? '')
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#039;');

  }


  // ==========================================================
  // FORMAT DATE
  // ==========================================================

  function formatDate(value){

    if(!value){
      return '-';
    }

    const date =
      new Date(value);

    if(
      Number.isNaN(
        date.getTime()
      )
    ){

      return value;

    }

    return date.toLocaleDateString(
      'id-ID',
      {
        day:'2-digit',
        month:'long',
        year:'numeric'
      }
    );

  }


  // ==========================================================
  // LOAD DETAIL
  // ==========================================================

  async function getTransactionDetail(
    transaction
  ){

    const res =
      await fetch(
        `/api/serah-terima/${transaction.id}`
      );


    if(!res.ok){

      throw new Error(
        `Gagal mengambil detail transaksi #${transaction.id}`
      );

    }


    const detail =
      await res.json();


    return {
      ...transaction,
      ...detail
    };

  }


  // ==========================================================
  // LOAD TRANSACTIONS
  // ==========================================================

  async function loadTransactions(){

    clearMessage();


    container.innerHTML = `

      <div class="empty">
        Memuat transaksi...
      </div>

    `;


    try{

      // ------------------------------------------------------
      // CEK AKUN
      // ------------------------------------------------------

      const meRes =
        await fetch(
          '/api/me'
        );


      if(!meRes.ok){

        throw new Error(
          'Gagal memuat informasi akun.'
        );

      }


      const me =
        await meRes.json();


      if(
        !me.user ||
        (
          me.user.role !== 'laundry' &&
          me.user.role !== 'admin'
        )
      ){

        window.location.href =
          '/login.html';

        return;

      }


      // ------------------------------------------------------
      // AMBIL SEMUA TRANSAKSI
      // ------------------------------------------------------

      const res =
        await fetch(
          '/api/serah-terima'
        );


      if(!res.ok){

        throw new Error(
          'Gagal mengambil transaksi.'
        );

      }


      const result =
        await res.json();


      const rows =
        Array.isArray(result)
          ? result
          : result.data || [];


      // ------------------------------------------------------
      // HANYA PENGAMBILAN
      // YANG SUDAH DITANDATANGANI RUANGAN
      // TAPI BELUM DITERIMA LAUNDRY
      // ------------------------------------------------------

      const pending =
        rows.filter(
          item => {

            const jenis =
              String(
                item.jenis_transaksi ||
                ''
              ).toLowerCase();


            const isPengambilan =
              jenis ===
              'pengambilan';


            const sudahDiserahkan =
              Boolean(
                item.tanda_tangan_penyerah
              );


            const belumDiterimaLaundry =
              !Boolean(
                item.tanda_tangan_penerima_laundry
              );


            return (
              isPengambilan &&
              sudahDiserahkan &&
              belumDiterimaLaundry
            );

          }
        );


      // ------------------------------------------------------
      // TIDAK ADA
      // ------------------------------------------------------

      if(
        pending.length === 0
      ){

        container.innerHTML = `

          <div class="empty">

            Tidak ada linen kotor yang menunggu
            penerimaan Laundry.

          </div>

        `;

        return;

      }


      // ------------------------------------------------------
      // AMBIL DETAIL
      // ------------------------------------------------------

      const detailed =
        await Promise.all(
          pending.map(
            getTransactionDetail
          )
        );


      renderTransactions(
        detailed
      );


    }catch(error){

      console.error(error);


      container.innerHTML = `

        <div class="empty">
          Gagal memuat transaksi.
        </div>

      `;


      showMessage(
        error.message ||
        'Gagal memuat transaksi.'
      );

    }

  }


  // ==========================================================
  // RENDER
  // ==========================================================

  function renderTransactions(
    transactions
  ){

    container.innerHTML =
      '';


    transactions.forEach(
      transaction => {

        const card =
          createTransactionCard(
            transaction
          );


        container.appendChild(
          card
        );


        setupSignatureCanvas(
          transaction.id
        );

      }
    );

  }


  // ==========================================================
  // CREATE CARD
  // ==========================================================

  function createTransactionCard(
    transaction
  ){

    const card =
      document.createElement(
        'div'
      );


    card.className =
      'transaction-card';


    const details =
      transaction.detail ||
      transaction.details ||
      transaction.items ||
      [];


    let totalInfeksius =
      0;


    let totalNonInfeksius =
      0;


    let rowsHtml =
      '';


    details.forEach(
      item => {

        const namaLinen =
          item.jenis_linen_nama ||
          '-';


        const infeksius =
          Number(
            item.jumlah_diambil_infeksius
          ) || 0;


        const nonInfeksius =
          Number(
            item.jumlah_diambil_non_infeksius
          ) || 0;


        totalInfeksius +=
          infeksius;


        totalNonInfeksius +=
          nonInfeksius;


        rowsHtml += `

          <tr>

            <td>

              <div class="linen-name">

                ${escapeHtml(
                  namaLinen
                )}

              </div>

            </td>


            <td class="number">

              ${infeksius}

            </td>


            <td class="number">

              ${nonInfeksius}

            </td>

          </tr>

        `;

      }
    );


    if(!rowsHtml){

      rowsHtml = `

        <tr>

          <td colspan="3">

            Tidak ada detail linen.

          </td>

        </tr>

      `;

    }


    card.innerHTML = `

      <div class="transaction-header">

        <div>

          <h2 class="transaction-title">

            Transaksi #${escapeHtml(
              transaction.id
            )}

          </h2>


          <div class="transaction-meta">

            Ruangan:

            <strong>

              ${escapeHtml(
                transaction.ruangan
              )}

            </strong>


            &nbsp; • &nbsp;


            Tanggal:

            <strong>

              ${formatDate(
                transaction.tanggal
              )}

            </strong>

          </div>

        </div>


        <span class="badge badge-pengambilan">

          Pengambilan

        </span>

      </div>


      <div class="transaction-body">


        <div class="info-box">

          <strong>

            Penerimaan Linen Kotor

          </strong>


          <span>

            Periksa jumlah linen yang diserahkan
            oleh ruangan. Jika sudah sesuai,
            isi nama penerima dan berikan tanda tangan.

          </span>

        </div>


        <!-- TABLE -->

        <div class="table-wrap">

          <table>

            <thead>

              <tr>

                <th>
                  Jenis Linen
                </th>

                <th>
                  Infeksius
                </th>

                <th>
                  Non-infeksius
                </th>

              </tr>

            </thead>


            <tbody>

              ${rowsHtml}


              <tr class="total-row">

                <td>

                  <strong>
                    Total
                  </strong>

                </td>


                <td class="number">

                  ${totalInfeksius}

                </td>


                <td class="number">

                  ${totalNonInfeksius}

                </td>

              </tr>

            </tbody>

          </table>

        </div>


        <!-- CONFIRMATION -->

        <h3 class="section-title">

          Konfirmasi Penerimaan Laundry

        </h3>


        <div class="field">

          <label
            for="nama-${transaction.id}"
          >
            Nama Penerima Laundry
          </label>


          <input
            type="text"
            id="nama-${transaction.id}"
            placeholder="Masukkan nama petugas Laundry"
            autocomplete="off"
          >

        </div>


        <!-- SIGNATURE -->

        <div>

          <label>
            Tanda Tangan Penerima Laundry
          </label>


          <div class="signature-wrapper">


            <div class="signature-label">

              TTD petugas Laundry yang menerima
              linen kotor

            </div>


            <canvas
              id="signature-${transaction.id}"
            ></canvas>


            <div class="signature-actions">

              <button
                type="button"
                class="btn-clear"
                onclick="clearSignature(
                  ${transaction.id}
                )"
              >

                Hapus Tanda Tangan

              </button>

            </div>


          </div>

        </div>


        <!-- BUTTON -->

        <div class="actions">

          <button
            type="button"
            class="btn-primary"
            id="submit-${transaction.id}"
            onclick="konfirmasiPenerimaanLaundry(
              ${transaction.id}
            )"
          >

            Konfirmasi Penerimaan

          </button>

        </div>


      </div>

    `;


    return card;

  }


  // ==========================================================
  // SETUP CANVAS
  // ==========================================================

  function setupSignatureCanvas(
    transactionId
  ){

    const canvas =
      document.getElementById(
        `signature-${transactionId}`
      );


    if(!canvas){
      return;
    }


    const ctx =
      canvas.getContext('2d');


    let drawing =
      false;


    const ratio =
      Math.max(
        window.devicePixelRatio || 1,
        1
      );


    const rect =
      canvas.getBoundingClientRect();


    canvas.width =
      rect.width * ratio;


    canvas.height =
      rect.height * ratio;


    ctx.setTransform(
      ratio,
      0,
      0,
      ratio,
      0,
      0
    );


    ctx.lineWidth =
      2;


    ctx.lineCap =
      'round';


    ctx.lineJoin =
      'round';


    ctx.strokeStyle =
      '#1C2B33';


    function position(event){

      const rect =
        canvas.getBoundingClientRect();


      return {

        x:
          event.clientX -
          rect.left,

        y:
          event.clientY -
          rect.top

      };

    }


    canvas.addEventListener(
      'pointerdown',
      event => {

        drawing =
          true;


        canvas.setPointerCapture(
          event.pointerId
        );


        const pos =
          position(event);


        ctx.beginPath();


        ctx.moveTo(
          pos.x,
          pos.y
        );

      }
    );


    canvas.addEventListener(
      'pointermove',
      event => {

        if(!drawing){
          return;
        }


        const pos =
          position(event);


        ctx.lineTo(
          pos.x,
          pos.y
        );


        ctx.stroke();

      }
    );


    canvas.addEventListener(
      'pointerup',
      event => {

        drawing =
          false;


        try{

          canvas.releasePointerCapture(
            event.pointerId
          );

        }catch(error){}

      }
    );


    canvas.addEventListener(
      'pointercancel',
      () => {

        drawing =
          false;

      }
    );

  }


  // ==========================================================
  // CLEAR SIGNATURE
  // ==========================================================

  function clearSignature(
    transactionId
  ){

    const canvas =
      document.getElementById(
        `signature-${transactionId}`
      );


    if(!canvas){
      return;
    }


    const ctx =
      canvas.getContext('2d');


    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

  }


  // ==========================================================
  // CHECK SIGNATURE
  // ==========================================================

  function hasSignature(
    transactionId
  ){

    const canvas =
      document.getElementById(
        `signature-${transactionId}`
      );


    if(!canvas){
      return false;
    }


    const ctx =
      canvas.getContext('2d');


    const imageData =
      ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
      );


    for(
      let i = 3;
      i < imageData.data.length;
      i += 4
    ){

      if(
        imageData.data[i] > 0
      ){

        return true;

      }

    }


    return false;

  }


  // ==========================================================
  // KONFIRMASI PENERIMAAN LAUNDRY
  // ==========================================================

  async function konfirmasiPenerimaanLaundry(
    transactionId
  ){

    clearMessage();


    const namaInput =
      document.getElementById(
        `nama-${transactionId}`
      );


    const canvas =
      document.getElementById(
        `signature-${transactionId}`
      );


    const button =
      document.getElementById(
        `submit-${transactionId}`
      );


    const nama =
      namaInput
        ? namaInput.value.trim()
        : '';


    // --------------------------------------------------------
    // VALIDASI NAMA
    // --------------------------------------------------------

    if(!nama){

      showMessage(
        'Nama penerima Laundry wajib diisi.'
      );


      namaInput?.focus();

      return;

    }


    // --------------------------------------------------------
    // VALIDASI TTD
    // --------------------------------------------------------

    if(
      !hasSignature(
        transactionId
      )
    ){

      showMessage(
        'Tanda tangan penerima Laundry wajib diisi.'
      );

      return;

    }


    const tandaTangan =
      canvas.toDataURL(
        'image/png'
      );


    try{

      button.disabled =
        true;


      button.textContent =
        'Menyimpan...';


      // ------------------------------------------------------
      // KIRIM KE BACKEND
      // ------------------------------------------------------

      const res =
        await fetch(

          `/api/serah-terima/${transactionId}/konfirmasi-penerimaan-laundry`,

          {

            method:'PUT',

            headers:{
              'Content-Type':
                'application/json'
            },

            body:
              JSON.stringify({

                nama_penerima_laundry:
                  nama,

                tanda_tangan_penerima_laundry:
                  tandaTangan

              })

          }

        );


      const result =
        await res.json()
          .catch(
            () => ({})
          );


      if(!res.ok){

        throw new Error(

          result.error ||
          'Gagal mengonfirmasi penerimaan Laundry.'

        );

      }


      // ------------------------------------------------------
      // BERHASIL
      // ------------------------------------------------------

      showMessage(

        'Penerimaan Laundry berhasil dikonfirmasi. Linen masuk ke Proses Laundry.',

        'success'

      );


      // ------------------------------------------------------
      // REFRESH
      // ------------------------------------------------------

      setTimeout(
        () => {

          loadTransactions();

        },
        1000
      );


    }catch(error){

      console.error(error);


      showMessage(

        error.message ||
        'Gagal melakukan konfirmasi.'

      );


      button.disabled =
        false;


      button.textContent =
        'Konfirmasi Penerimaan';

    }

  }


  // ==========================================================
  // START
  // ==========================================================

  loadTransactions();

</script>

</body>
</html>

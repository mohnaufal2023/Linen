<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proses Laundry - Linen</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 28px;
      margin-bottom: 6px;
    }

    .header p {
      color: #6b7280;
      font-size: 14px;
    }

    .back-btn {
      border: none;
      background: #2563eb;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
    }

    .back-btn:hover {
      background: #1d4ed8;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .summary-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .summary-card .label {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .summary-card .number {
      font-size: 28px;
      font-weight: bold;
    }

    .filter-box {
      background: white;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .filter-box label {
      font-size: 14px;
      font-weight: bold;
      margin-right: 10px;
    }

    .filter-box select {
      padding: 9px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      min-width: 220px;
    }

    .process-list {
      display: grid;
      gap: 16px;
    }

    .process-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .process-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 16px;
    }

    .process-title h3 {
      font-size: 19px;
      margin-bottom: 6px;
    }

    .process-title p {
      color: #6b7280;
      font-size: 13px;
    }

    .status {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
    }

    .status-menunggu {
      background: #fff7ed;
      color: #c2410c;
    }

    .status-cuci {
      background: #eff6ff;
      color: #1d4ed8;
    }

    .status-verifikasi {
      background: #fefce8;
      color: #a16207;
    }

    .status-selesai {
      background: #f0fdf4;
      color: #15803d;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .info-box {
      background: #f9fafb;
      border-radius: 8px;
      padding: 12px;
    }

    .info-box .label {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 5px;
    }

    .info-box .value {
      font-size: 17px;
      font-weight: bold;
    }

    .comparison {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 18px;
    }

    .comparison-box {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 16px;
    }

    .comparison-box h4 {
      margin-bottom: 12px;
      font-size: 15px;
    }

    .comparison-row {
      display: flex;
      justify-content: space-between;
      padding: 7px 0;
      border-bottom: 1px solid #f3f4f6;
      font-size: 14px;
    }

    .comparison-row:last-child {
      border-bottom: none;
    }

    .comparison-row strong {
      font-size: 16px;
    }

    .form-section {
      border-top: 1px solid #e5e7eb;
      padding-top: 18px;
      margin-top: 18px;
    }

    .form-section h4 {
      margin-bottom: 14px;
      font-size: 16px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-group label {
      font-size: 13px;
      font-weight: bold;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
    }

    .form-group textarea {
      min-height: 80px;
      resize: vertical;
    }

    .action-area {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .btn-success {
      background: #16a34a;
      color: white;
    }

    .btn-success:hover {
      background: #15803d;
    }

    .btn-warning {
      background: #d97706;
      color: white;
    }

    .btn-warning:hover {
      background: #b45309;
    }

    .btn-secondary {
      background: #6b7280;
      color: white;
    }

    .btn-secondary:hover {
      background: #4b5563;
    }

    .warning-box {
      background: #fff7ed;
      border: 1px solid #fdba74;
      color: #9a3412;
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 14px;
      font-size: 14px;
      line-height: 1.5;
    }

    .success-box {
      background: #f0fdf4;
      border: 1px solid #86efac;
      color: #166534;
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 14px;
    }

    .empty {
      background: white;
      padding: 40px;
      text-align: center;
      border-radius: 12px;
      color: #6b7280;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #6b7280;
    }

    .error {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .note {
      font-size: 12px;
      color: #6b7280;
      margin-top: 6px;
    }

    @media (max-width: 900px) {
      .summary {
        grid-template-columns: repeat(2, 1fr);
      }

      .info-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .container {
        padding: 15px;
      }

      .header {
        flex-direction: column;
        align-items: flex-start;
      }

      .summary {
        grid-template-columns: 1fr 1fr;
      }

      .info-grid,
      .comparison,
      .form-grid {
        grid-template-columns: 1fr;
      }

      .process-header {
        flex-direction: column;
      }

      .form-group.full {
        grid-column: auto;
      }

      .action-area {
        flex-direction: column;
      }

      .action-area button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <div>
        <h1>Proses Laundry</h1>
        <p>Kelola proses pencucian, verifikasi, dan hasil linen.</p>
      </div>

      <a href="/laundry-dashboard.html" class="back-btn">
        ← Dashboard
      </a>
    </div>

    <div id="error-container"></div>

    <!-- SUMMARY -->
    <div class="summary">
      <div class="summary-card">
        <div class="label">Menunggu Dicuci</div>
        <div class="number" id="count-menunggu">0</div>
      </div>

      <div class="summary-card">
        <div class="label">Sedang Dicuci</div>
        <div class="number" id="count-cuci">0</div>
      </div>

      <div class="summary-card">
        <div class="label">Menunggu Verifikasi</div>
        <div class="number" id="count-verifikasi">0</div>
      </div>

      <div class="summary-card">
        <div class="label">Selesai</div>
        <div class="number" id="count-selesai">0</div>
      </div>
    </div>

    <!-- FILTER -->
    <div class="filter-box">
      <label for="filter-status">Filter Status:</label>

      <select id="filter-status">
        <option value="semua">Semua</option>
        <option value="menunggu_cuci">Menunggu Dicuci</option>
        <option value="sedang_dicuci">Sedang Dicuci</option>
        <option value="menunggu_verifikasi">Menunggu Verifikasi</option>
        <option value="selesai">Selesai</option>
      </select>
    </div>

    <div id="loading" class="loading">
      Memuat data proses laundry...
    </div>

    <div id="process-list" class="process-list"></div>

  </div>

  <script>

    let processes = [];

    const loading = document.getElementById("loading");
    const processList = document.getElementById("process-list");
    const filterStatus = document.getElementById("filter-status");

    /*
     * ==========================================
     * FORMAT ANGKA
     * ==========================================
     */
    function formatNumber(number) {
      return Number(number || 0).toLocaleString("id-ID");
    }

    /*
     * ==========================================
     * FORMAT TANGGAL
     * ==========================================
     */
    function formatDate(dateString) {

      if (!dateString) {
        return "-";
      }

      const date = new Date(dateString);

      if (isNaN(date.getTime())) {
        return dateString;
      }

      return date.toLocaleString("id-ID", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    /*
     * ==========================================
     * ESCAPE HTML
     * ==========================================
     */
    function escapeHtml(value) {

      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    /*
     * ==========================================
     * STATUS
     * ==========================================
     */
    function getStatusLabel(status) {

      const labels = {
        menunggu_cuci: "Menunggu Dicuci",
        sedang_dicuci: "Sedang Dicuci",
        menunggu_verifikasi: "Menunggu Verifikasi",
        selesai: "Selesai"
      };

      return labels[status] || status;
    }

    function getStatusClass(status) {

      const classes = {
        menunggu_cuci: "status-menunggu",
        sedang_dicuci: "status-cuci",
        menunggu_verifikasi: "status-verifikasi",
        selesai: "status-selesai"
      };

      return classes[status] || "";
    }

    /*
     * ==========================================
     * LOAD DATA
     * ==========================================
     */
    async function loadProcesses() {

      loading.style.display = "block";
      processList.innerHTML = "";

      try {

        const response = await fetch("/api/proses-laundry");

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.message || "Gagal mengambil data proses laundry.");
        }

        /*
         * Backend bisa mengembalikan array langsung
         * atau { data: [...] }
         */
        if (Array.isArray(result)) {
          processes = result;
        } else {
          processes = Array.isArray(result.data)
            ? result.data
            : [];
        }

        updateSummary();
        renderProcesses();

      } catch (error) {

        console.error(error);

        document.getElementById("error-container").innerHTML = `
          <div class="error">
            ${escapeHtml(error.message)}
          </div>
        `;

      } finally {

        loading.style.display = "none";
      }
    }

    /*
     * ==========================================
     * SUMMARY
     * ==========================================
     */
    function updateSummary() {

      const menunggu = processes.filter(
        item => item.status === "menunggu_cuci"
      ).length;

      const cuci = processes.filter(
        item => item.status === "sedang_dicuci"
      ).length;

      const verifikasi = processes.filter(
        item => item.status === "menunggu_verifikasi"
      ).length;

      const selesai = processes.filter(
        item => item.status === "selesai"
      ).length;

      document.getElementById("count-menunggu").textContent = menunggu;
      document.getElementById("count-cuci").textContent = cuci;
      document.getElementById("count-verifikasi").textContent = verifikasi;
      document.getElementById("count-selesai").textContent = selesai;
    }

    /*
     * ==========================================
     * RENDER
     * ==========================================
     */
    function renderProcesses() {

      const filter = filterStatus.value;

      let data = processes;

      if (filter !== "semua") {

        data = processes.filter(
          item => item.status === filter
        );
      }

      if (data.length === 0) {

        processList.innerHTML = `
          <div class="empty">
            Tidak ada proses laundry pada status ini.
          </div>
        `;

        return;
      }

      processList.innerHTML = data
        .map(renderProcessCard)
        .join("");
    }

    /*
     * ==========================================
     * CARD
     * ==========================================
     */
    function renderProcessCard(item) {

      const initialInfeksius =
        Number(item.jumlah_infeksius || 0);

      const initialNonInfeksius =
        Number(item.jumlah_non_infeksius || 0);

      const initialTotal =
        Number(
          item.jumlah_total ||
          initialInfeksius + initialNonInfeksius
        );

      const verifiedInfeksius =
        Number(item.jumlah_verifikasi_infeksius || 0);

      const verifiedNonInfeksius =
        Number(item.jumlah_verifikasi_non_infeksius || 0);

      const verifiedTotal =
        verifiedInfeksius + verifiedNonInfeksius;

      const layak =
        Number(item.jumlah_layak || 0);

      const rusak =
        Number(item.jumlah_rusak || 0);

      return `
        <div class="process-card">

          <div class="process-header">

            <div class="process-title">

              <h3>
                ${escapeHtml(item.jenis_linen_nama || "Linen")}
              </h3>

              <p>
                Ruangan:
                <strong>
                  ${escapeHtml(item.ruangan || "-")}
                </strong>
              </p>

              <p>
                Transaksi #${escapeHtml(item.serah_terima_id || "-")}
                ·
                ${formatDate(item.tanggal)}
              </p>

            </div>

            <span class="status ${getStatusClass(item.status)}">
              ${getStatusLabel(item.status)}
            </span>

          </div>

          <!-- DATA AWAL -->
          <div class="info-grid">

            <div class="info-box">
              <div class="label">
                Infeksius
              </div>

              <div class="value">
                ${formatNumber(initialInfeksius)}
              </div>
            </div>

            <div class="info-box">
              <div class="label">
                Non-infeksius
              </div>

              <div class="value">
                ${formatNumber(initialNonInfeksius)}
              </div>
            </div>

            <div class="info-box">
              <div class="label">
                Total
              </div>

              <div class="value">
                ${formatNumber(initialTotal)}
              </div>
            </div>

            <div class="info-box">
              <div class="label">
                Dibuat
              </div>

              <div class="value" style="font-size:13px;">
                ${formatDate(item.created_at)}
              </div>
            </div>

          </div>

          ${renderAction(item, {
            initialInfeksius,
            initialNonInfeksius,
            initialTotal,
            verifiedInfeksius,
            verifiedNonInfeksius,
            verifiedTotal,
            layak,
            rusak
          })}

        </div>
      `;
    }

    /*
     * ==========================================
     * ACTION BERDASARKAN STATUS
     * ==========================================
     */
    function renderAction(item, values) {

      /*
       * MENUNGGU CUCI
       */
      if (item.status === "menunggu_cuci") {

        return `
          <div class="form-section">

            <div class="action-area">

              <button
                class="btn-primary"
                onclick="mulaiCuci(${item.id})"
              >
                ▶ Mulai Cuci
              </button>

            </div>

          </div>
        `;
      }

      /*
       * SEDANG DICUCI
       */
      if (item.status === "sedang_dicuci") {

        return `
          <div class="form-section">

            <div class="success-box">
              Proses sedang dicuci.
              Setelah pencucian selesai, klik
              <strong>Selesai Cuci</strong>
              untuk masuk ke tahap verifikasi.
            </div>

            <div class="action-area">

              <button
                class="btn-success"
                onclick="selesaiCuci(${item.id})"
              >
                ✓ Selesai Cuci
              </button>

            </div>

          </div>
        `;
      }

      /*
       * MENUNGGU VERIFIKASI
       */
      if (item.status === "menunggu_verifikasi") {

        return `
          <div class="form-section">

            <h4>
              Verifikasi Jumlah Linen
            </h4>

            <div class="comparison">

              <div class="comparison-box">

                <h4>Data Awal dari Ruangan</h4>

                <div class="comparison-row">
                  <span>Infeksius</span>
                  <strong>
                    ${formatNumber(values.initialInfeksius)}
                  </strong>
                </div>

                <div class="comparison-row">
                  <span>Non-infeksius</span>
                  <strong>
                    ${formatNumber(values.initialNonInfeksius)}
                  </strong>
                </div>

                <div class="comparison-row">
                  <span>Total</span>
                  <strong>
                    ${formatNumber(values.initialTotal)}
                  </strong>
                </div>

              </div>

              <div class="comparison-box">

                <h4>Hasil Verifikasi Laundry</h4>

                <div class="form-grid">

                  <div class="form-group">

                    <label>
                      Infeksius
                    </label>

                    <input
                      type="number"
                      id="verifikasi-infeksius-${item.id}"
                      min="0"
                      value="${values.verifiedInfeksius}"
                    />

                  </div>

                  <div class="form-group">

                    <label>
                      Non-infeksius
                    </label>

                    <input
                      type="number"
                      id="verifikasi-non-infeksius-${item.id}"
                      min="0"
                      value="${values.verifiedNonInfeksius}"
                    />

                  </div>

                </div>

              </div>

            </div>

            <div class="note">
              Jika hasil verifikasi berbeda dari data awal,
              sistem akan meminta konfirmasi sebelum dilanjutkan.
            </div>

            <div class="action-area">

              <button
                class="btn-warning"
                onclick="verifikasi(${item.id})"
              >
                ✓ Verifikasi
              </button>

            </div>

          </div>
        `;
      }

      /*
       * SELESAI
       */
      if (item.status === "selesai") {

        return `
          <div class="form-section">

            <div class="comparison">

              <div class="comparison-box">

                <h4>
                  Hasil Verifikasi
                </h4>

                <div class="comparison-row">
                  <span>Infeksius</span>
                  <strong>
                    ${formatNumber(values.verifiedInfeksius)}
                  </strong>
                </div>

                <div class="comparison-row">
                  <span>Non-infeksius</span>
                  <strong>
                    ${formatNumber(values.verifiedNonInfeksius)}
                  </strong>
                </div>

                <div class="comparison-row">
                  <span>Total</span>
                  <strong>
                    ${formatNumber(values.verifiedTotal)}
                  </strong>
                </div>

              </div>

              <div class="comparison-box">

                <h4>
                  Hasil Akhir
                </h4>

                <div class="comparison-row">
                  <span>Layak</span>
                  <strong>
                    ${formatNumber(values.layak)}
                  </strong>
                </div>

                <div class="comparison-row">
                  <span>Rusak</span>
                  <strong>
                    ${formatNumber(values.rusak)}
                  </strong>
                </div>

              </div>

            </div>

            ${
              item.keterangan_rusak
                ? `
                  <div class="warning-box">
                    <strong>Keterangan Kerusakan:</strong><br>
                    ${escapeHtml(item.keterangan_rusak)}
                  </div>
                `
                : ""
            }

            <div class="success-box">
              Proses laundry sudah selesai.
              Stok linen layak dan rusak telah diperbarui.
            </div>

          </div>
        `;
      }

      return "";
    }

    /*
     * ==========================================
     * MULAI CUCI
     * ==========================================
     */
    async function mulaiCuci(id) {

      if (!confirm("Mulai proses pencucian linen ini?")) {
        return;
      }

      try {

        const response = await fetch(
          `/api/proses-laundry/${id}/mulai`,
          {
            method: "PUT",
            headers: {
              "Content-Type": "application/json"
            }
          }
        );

        const result = await response.json();

        if (!response.ok) {
          throw new Error(
            result.message || "Gagal memulai proses pencucian."
          );
        }

        alert("Proses pencucian dimulai.");

        await loadProcesses();

      } catch (error) {

        alert(error.message);

      }
    }

    /*
     * ==========================================
     * SELESAI CUCI
     * ==========================================
     */
    async function selesaiCuci(id) {

      if (!confirm(
        "Apakah pencucian linen ini sudah selesai?"
      )) {
        return;
      }

      try {

        const response = await fetch(
          `/api/proses-laundry/${id}/selesai-cuci`,
          {
            method: "PUT",
            headers: {
              "Content-Type": "application/json"
            }
          }
        );

        const result = await response.json();

        if (!response.ok) {
          throw new Error(
            result.message || "Gagal menyelesaikan pencucian."
          );
        }

        alert(
          "Pencucian selesai. Silakan lakukan verifikasi."
        );

        await loadProcesses();

      } catch (error) {

        alert(error.message);

      }
    }

    /*
     * ==========================================
     * VERIFIKASI
     * ==========================================
     */
    async function verifikasi(id) {

      const inputInfeksius =
        document.getElementById(
          `verifikasi-infeksius-${id}`
        );

      const inputNonInfeksius =
        document.getElementById(
          `verifikasi-non-infeksius-${id}`
        );

      const jumlahVerifikasiInfeksius =
        Number(inputInfeksius.value);

      const jumlahVerifikasiNonInfeksius =
        Number(inputNonInfeksius.value);

      if (
        !Number.isInteger(jumlahVerifikasiInfeksius) ||
        jumlahVerifikasiInfeksius < 0
      ) {

        alert(
          "Jumlah verifikasi infeksius harus berupa angka bulat dan tidak boleh negatif."
        );

        return;
      }

      if (
        !Number.isInteger(jumlahVerifikasiNonInfeksius) ||
        jumlahVerifikasiNonInfeksius < 0
      ) {

        alert(
          "Jumlah verifikasi non-infeksius harus berupa angka bulat dan tidak boleh negatif."
        );

        return;
      }

      const process = processes.find(
        item => Number(item.id) === Number(id)
      );

      if (!process) {
        alert("Data proses tidak ditemukan.");
        return;
      }

      const initialInfeksius =
        Number(process.jumlah_infeksius || 0);

      const initialNonInfeksius =
        Number(process.jumlah_non_infeksius || 0);

      const initialTotal =
        Number(
          process.jumlah_total ||
          initialInfeksius + initialNonInfeksius
        );

      const verifiedTotal =
        jumlahVerifikasiInfeksius +
        jumlahVerifikasiNonInfeksius;

      const mismatch =
        jumlahVerifikasiInfeksius !== initialInfeksius ||
        jumlahVerifikasiNonInfeksius !== initialNonInfeksius;

      let konfirmasiMismatch = false;

      /*
       * Jika berbeda, tampilkan peringatan.
       */
      if (mismatch) {

        const pesan = `
HASIL VERIFIKASI BERBEDA DENGAN DATA AWAL

Data awal:
- Infeksius: ${initialInfeksius}
- Non-infeksius: ${initialNonInfeksius}
- Total: ${initialTotal}

Hasil verifikasi:
- Infeksius: ${jumlahVerifikasiInfeksius}
- Non-infeksius: ${jumlahVerifikasiNonInfeksius}
- Total: ${verifiedTotal}

Apakah Anda yakin ingin menyimpan hasil verifikasi ini?
        `;

        konfirmasiMismatch = confirm(pesan);

        if (!konfirmasiMismatch) {
          return;
        }
      } else {

        if (!confirm(
          `Simpan hasil verifikasi ${verifiedTotal} linen?`
        )) {
          return;
        }
      }

      try {

        const response = await fetch(
          `/api/proses-laundry/${id}/verifikasi`,
          {
            method: "PUT",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              jumlah_verifikasi_infeksius:
                jumlahVerifikasiInfeksius,

              jumlah_verifikasi_non_infeksius:
                jumlahVerifikasiNonInfeksius,

              konfirmasi_mismatch:
                konfirmasiMismatch
            })
          }
        );

        const result = await response.json();

        /*
         * Backend mengembalikan 409 jika mismatch
         * belum dikonfirmasi.
         */
        if (response.status === 409 && result.warning) {

          const dataAwal =
            result.data_awal || {};

          const hasil =
            result.hasil_verifikasi || {};

          const lanjut = confirm(`
Jumlah berbeda dengan data awal.

Data awal:
Infeksius: ${dataAwal.infeksius || 0}
Non-infeksius: ${dataAwal.non_infeksius || 0}
Total: ${dataAwal.total || 0}

Hasil verifikasi:
Infeksius: ${hasil.infeksius || 0}
Non-infeksius: ${hasil.non_infeksius || 0}
Total: ${hasil.total || 0}

Lanjutkan dan simpan hasil verifikasi?
          `);

          if (!lanjut) {
            return;
          }

          /*
           * Kirim ulang dengan konfirmasi true.
           */
          const responseConfirm = await fetch(
            `/api/proses-laundry/${id}/verifikasi`,
            {
              method: "PUT",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                jumlah_verifikasi_infeksius:
                  jumlahVerifikasiInfeksius,

                jumlah_verifikasi_non_infeksius:
                  jumlahVerifikasiNonInfeksius,

                konfirmasi_mismatch: true
              })
            }
          );

          const resultConfirm =
            await responseConfirm.json();

          if (!responseConfirm.ok) {
            throw new Error(
              resultConfirm.message ||
              "Gagal menyimpan verifikasi."
            );
          }

          alert(
            "Hasil verifikasi berhasil disimpan."
          );

          await loadProcesses();

          return;
        }

        if (!response.ok) {
          throw new Error(
            result.message ||
            "Gagal menyimpan hasil verifikasi."
          );
        }

        alert(
          "Hasil verifikasi berhasil disimpan."
        );

        await loadProcesses();

      } catch (error) {

        console.error(error);

        alert(error.message);
      }
    }

    /*
     * ==========================================
     * SELESAIKAN PROSES
     * ==========================================
     *
     * Fungsi ini dipanggil setelah verifikasi.
     *
     * Saat ini tombol hasil akhir akan muncul
     * melalui fungsi tambahan di bawah.
     */

    function renderFinishForm(item, values) {

      return `
        <div class="form-section">

          <h4>
            Hasil Akhir Pencucian
          </h4>

          <div class="success-box">
            Hasil verifikasi:
            <strong>
              ${formatNumber(values.verifiedTotal)}
            </strong>
            linen.
            <br>
            Jumlah Layak + Rusak harus sama dengan
            ${formatNumber(values.verifiedTotal)}.
          </div>

          <div class="form-grid">

            <div class="form-group">

              <label>
                Jumlah Layak
              </label>

              <input
                type="number"
                min="0"
                id="layak-${item.id}"
                value="0"
              />

            </div>

            <div class="form-group">

              <label>
                Jumlah Rusak
              </label>

              <input
                type="number"
                min="0"
                id="rusak-${item.id}"
                value="0"
                oninput="toggleKeteranganRusak(${item.id})"
              />

            </div>

            <div
              class="form-group full"
              id="keterangan-rusak-group-${item.id}"
              style="display:none;"
            >

              <label>
                Keterangan Kerusakan
              </label>

              <textarea
                id="keterangan-rusak-${item.id}"
                placeholder="Jelaskan kerusakan linen..."
              ></textarea>

            </div>

          </div>

          <div class="action-area">

            <button
              class="btn-success"
              onclick="selesaiProses(${item.id}, ${values.verifiedTotal})"
            >
              ✓ Selesaikan Proses
            </button>

          </div>

        </div>
      `;
    }

    /*
     * ==========================================
     * TAMPILKAN FORM HASIL AKHIR
     * ==========================================
     */
    function toggleKeteranganRusak(id) {

      const rusakInput =
        document.getElementById(`rusak-${id}`);

      const group =
        document.getElementById(
          `keterangan-rusak-group-${id}`
        );

      if (!rusakInput || !group) {
        return;
      }

      const rusak = Number(rusakInput.value || 0);

      group.style.display =
        rusak > 0 ? "flex" : "none";
    }

    /*
     * ==========================================
     * SELESAI PROSES
     * ==========================================
     */
    async function selesaiProses(id, verifiedTotal) {

      const layak =
        Number(
          document.getElementById(`layak-${id}`).value
        );

      const rusak =
        Number(
          document.getElementById(`rusak-${id}`).value
        );

      const keteranganElement =
        document.getElementById(
          `keterangan-rusak-${id}`
        );

      const keteranganRusak =
        keteranganElement
          ? keteranganElement.value.trim()
          : "";

      if (
        !Number.isInteger(layak) ||
        layak < 0
      ) {

        alert(
          "Jumlah layak harus berupa angka bulat dan tidak boleh negatif."
        );

        return;
      }

      if (
        !Number.isInteger(rusak) ||
        rusak < 0
      ) {

        alert(
          "Jumlah rusak harus berupa angka bulat dan tidak boleh negatif."
        );

        return;
      }

      if (rusak > 0 && !keteranganRusak) {

        alert(
          "Keterangan kerusakan wajib diisi jika ada linen rusak."
        );

        return;
      }

      if (layak + rusak !== Number(verifiedTotal)) {

        alert(
          `Jumlah Layak + Rusak harus sama dengan hasil verifikasi (${verifiedTotal}).`
        );

        return;
      }

      if (!confirm(
        `Selesaikan proses dengan ${layak} layak dan ${rusak} rusak?`
      )) {
        return;
      }

      try {

        const response = await fetch(
          `/api/proses-laundry/${id}/selesai`,
          {
            method: "PUT",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              jumlah_layak: layak,
              jumlah_rusak: rusak,
              keterangan_rusak: keteranganRusak
            })
          }
        );

        const result = await response.json();

        if (!response.ok) {
          throw new Error(
            result.message ||
            "Gagal menyelesaikan proses laundry."
          );
        }

        alert(
          "Proses laundry berhasil diselesaikan."
        );

        await loadProcesses();

      } catch (error) {

        console.error(error);

        alert(error.message);
      }
    }

    /*
     * ==========================================
     * OVERRIDE RENDER UNTUK VERIFIKASI
     * ==========================================
     *
     * Setelah verifikasi tersimpan, status backend
     * masih "menunggu_verifikasi".
     *
     * Maka kita tampilkan form Layak/Rusak juga
     * setelah hasil verifikasi tersedia.
     */

    const originalRenderAction = renderAction;

    renderAction = function(item, values) {

      if (item.status === "menunggu_verifikasi") {

        const hasVerification =
          Number(item.jumlah_verifikasi_infeksius || 0) > 0 ||
          Number(item.jumlah_verifikasi_non_infeksius || 0) > 0;

        /*
         * Jika sudah ada hasil verifikasi,
         * tampilkan form Layak/Rusak.
         */
        if (hasVerification) {

          return `
            <div class="form-section">

              <h4>
                Verifikasi Jumlah Linen
              </h4>

              <div class="comparison">

                <div class="comparison-box">

                  <h4>Data Awal dari Ruangan</h4>

                  <div class="comparison-row">
                    <span>Infeksius</span>
                    <strong>
                      ${formatNumber(values.initialInfeksius)}
                    </strong>
                  </div>

                  <div class="comparison-row">
                    <span>Non-infeksius</span>
                    <strong>
                      ${formatNumber(values.initialNonInfeksius)}
                    </strong>
                  </div>

                  <div class="comparison-row">
                    <span>Total</span>
                    <strong>
                      ${formatNumber(values.initialTotal)}
                    </strong>
                  </div>

                </div>

                <div class="comparison-box">

                  <h4>Hasil Verifikasi</h4>

                  <div class="comparison-row">
                    <span>Infeksius</span>
                    <strong>
                      ${formatNumber(values.verifiedInfeksius)}
                    </strong>
                  </div>

                  <div class="comparison-row">
                    <span>Non-infeksius</span>
                    <strong>
                      ${formatNumber(values.verifiedNonInfeksius)}
                    </strong>
                  </div>

                  <div class="comparison-row">
                    <span>Total</span>
                    <strong>
                      ${formatNumber(values.verifiedTotal)}
                    </strong>
                  </div>

                </div>

              </div>

              ${renderFinishForm(item, values)}

            </div>
          `;
        }

        /*
         * Jika belum ada verifikasi,
         * tampilkan form verifikasi biasa.
         */
        return `
          <div class="form-section">

            <h4>
              Verifikasi Jumlah Linen
            </h4>

            <div class="comparison">

              <div class="comparison-box">

                <h4>Data Awal dari Ruangan</h4>

                <div class="comparison-row">
                  <span>Infeksius</span>
                  <strong>
                    ${formatNumber(values.initialInfeksius)}
                  </strong>
                </div>

                <div class="comparison-row">
                  <span>Non-infeksius</span>
                  <strong>
                    ${formatNumber(values.initialNonInfeksius)}
                  </strong>
                </div>

                <div class="comparison-row">
                  <span>Total</span>
                  <strong>
                    ${formatNumber(values.initialTotal)}
                  </strong>
                </div>

              </div>

              <div class="comparison-box">

                <h4>Hasil Verifikasi Laundry</h4>

                <div class="form-grid">

                  <div class="form-group">

                    <label>
                      Infeksius
                    </label>

                    <input
                      type="number"
                      id="verifikasi-infeksius-${item.id}"
                      min="0"
                      value="0"
                    />

                  </div>

                  <div class="form-group">

                    <label>
                      Non-infeksius
                    </label>

                    <input
                      type="number"
                      id="verifikasi-non-infeksius-${item.id}"
                      min="0"
                      value="0"
                    />

                  </div>

                </div>

              </div>

            </div>

            <div class="warning-box">
              Laundry melakukan pengecekan terhadap jumlah
              infeksius dan non-infeksius yang diterima.
              Jika berbeda dengan data awal, sistem akan
              meminta konfirmasi.
            </div>

            <div class="action-area">

              <button
                class="btn-warning"
                onclick="verifikasi(${item.id})"
              >
                ✓ Verifikasi
              </button>

            </div>

          </div>
        `;
      }

      return originalRenderAction(item, values);
    };

    /*
     * ==========================================
     * FILTER
     * ==========================================
     */
    filterStatus.addEventListener(
      "change",
      renderProcesses
    );

    /*
     * ==========================================
     * LOAD AWAL
     * ==========================================
     */
    loadProcesses();

  </script>

</body>
</html>
